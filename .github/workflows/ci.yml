name: CodeBrain CI

on:
  push:
    branches: [main, master]
    paths-ignore:
      - "docs/**"
      - "README.md"
      - "*.md"
  pull_request:
    branches: [main, master]
    paths-ignore:
      - "docs/**"
      - "README.md"
      - "*.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-checks:
    name: Backend API Quality Gate
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: hire4thon
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d hire4thon"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_HOSTNAME: 127.0.0.1
      DB_PORT: 5432
      DB_NAME: hire4thon
      JWT_SECRET_KEY: ci-only-secret
      GROQ_API_KEY: ci-placeholder
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest pytest-asyncio

      - name: Apply database migrations
        run: python -m alembic -c db/alembic.ini upgrade head

      - name: Run backend tests
        working-directory: backend
        run: python -m pytest -q tests/test_auth_flow.py tests/test_milestone1_flow.py

  frontend-checks:
    name: Frontend UI Quality Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node 22.x
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend lint
        working-directory: frontend
        run: npm run lint

      - name: Build frontend production bundle
        working-directory: frontend
        run: npm run build

  deployment-gate:
    name: Deployment Quality Gate
    needs: [backend-checks, frontend-checks]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - name: Validate quality gates passed
        run: echo "CI quality checks passed for all components. Repository is ready for production deployment."
